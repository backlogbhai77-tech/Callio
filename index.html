<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusVoice — Encrypted Peer VoIP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darksurface: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#6366f1',
                    }
                }
            }
        }
    </script>
    <!-- PeerJS & Lucide Icons -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darksurface text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-accent selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="w-full border-b border-slate-800 bg-cardbg/50 backdrop-blur-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i data-lucide="radio" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-white">NexusVoice</h1>
                <p class="text-[10px] text-slate-400 font-mono tracking-wider uppercase">P2P Secure Audio Channel</p>
            </div>
        </div>
        <div id="connection-status-badge" class="flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs font-medium">
            <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
            <span id="status-text" class="text-slate-300">Initializing...</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-xl mx-auto px-4 py-8 flex-1 flex flex-col justify-center">

        <!-- AUTH VIEW (Step 1) -->
        <div id="auth-container" class="bg-cardbg border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
            <div>
                <h2 class="text-xl font-semibold text-white">Configure Node Identity</h2>
                <p class="text-xs text-slate-400 mt-1">Register a unique network endpoint handle to establish incoming and outgoing routing streams.</p>
            </div>
            
            <div class="space-y-2">
                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400">Endpoint Handle ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i data-lucide="at-sign" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="username-input" placeholder="e.g. alpha-node-01" class="w-full pl-11 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm font-mono text-white transition">
                </div>
            </div>

            <button onclick="initializeNode()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] font-medium text-sm rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
                <span>Establish Connection</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- DASHBOARD VIEW (Step 2 - Hidden Initially) -->
        <div id="dashboard-container" class="hidden space-y-6">
            
            <!-- Node Info Card -->
            <div class="bg-cardbg border border-slate-800 rounded-2xl p-5 shadow-xl flex items-center justify-between">
                <div>
                    <span class="text-[10px] uppercase font-mono tracking-wider text-slate-400">Active Handle</span>
                    <div id="display-node-id" class="text-lg font-mono font-bold text-indigo-400 mt-0.5">---</div>
                </div>
                <div class="h-10 w-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300">
                    <i data-lucide="shield-check" class="w-5 h-5 text-emerald-400"></i>
                </div>
            </div>

            <!-- Dialer Card -->
            <div class="bg-cardbg border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-200">Peer Transmission Dialer</h3>
                    <i data-lucide="phone-outgoing" class="w-4 h-4 text-slate-400"></i>
                </div>
                
                <div class="space-y-2">
                    <input type="text" id="target-id-input" placeholder="Enter target remote handle..." class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm font-mono text-white transition">
                </div>

                <button onclick="initiateCall()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] font-medium text-sm rounded-xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2">
                    <i data-lucide="phone" class="w-4 h-4"></i>
                    <span>Initialize Call Session</span>
                </button>
            </div>

            <!-- Active / In-Call Control Panel (Hidden by default) -->
            <div id="active-call-panel" class="hidden bg-slate-900 border border-indigo-500/30 rounded-2xl p-6 shadow-2xl space-y-5 text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-indigo-600/5 pointer-events-none"></div>
                
                <div class="space-y-1 relative z-10">
                    <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-mono mb-2">
                        <span class="h-2 w-2 rounded-full bg-indigo-500 animate-ping"></span>
                        <span id="call-state-label">Secure Channel Active</span>
                    </div>
                    <div id="remote-peer-label" class="text-base font-mono font-semibold text-white">Connected Peer</div>
                </div>

                <!-- Waveform Audio Simulation -->
                <div class="flex justify-center items-center space-x-1 h-8 relative z-10">
                    <span class="w-1 bg-indigo-500 h-4 animate-pulse rounded-full"></span>
                    <span class="w-1 bg-indigo-500 h-8 animate-pulse rounded-full delay-75"></span>
                    <span class="w-1 bg-indigo-500 h-5 animate-pulse rounded-full delay-150"></span>
                    <span class="w-1 bg-indigo-500 h-7 animate-pulse rounded-full delay-200"></span>
                    <span class="w-1 bg-indigo-500 h-3 animate-pulse rounded-full"></span>
                </div>

                <button onclick="terminateCall()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-500 active:scale-[0.99] font-medium text-sm rounded-xl transition shadow-lg shadow-rose-600/20 flex items-center justify-center space-x-2 relative z-10">
                    <i data-lucide="phone-off" class="w-4 h-4"></i>
                    <span>Terminate Session</span>
                </button>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-800 font-mono">
        WebRTC P2P Engine • Zero Relay Latency
    </footer>

    <!-- Hidden Audio Element -->
    <audio id="remote-audio-stream" autoplay></audio>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        let peerInstance = null;
        let activeCallSession = null;
        let localAudioStream = null;
        let nodeHandleId = null;

        // Update UI Status helper
        function updateSystemStatus(status, type) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            text.innerText = status;
            
            if (type === 'success') {
                dot.className = "h-2 w-2 rounded-full bg-emerald-500";
            } else if (type === 'error') {
                dot.className = "h-2 w-2 rounded-full bg-rose-500 animate-pulse";
            } else {
                dot.className = "h-2 w-2 rounded-full bg-amber-500 animate-pulse";
            }
        }

        async function initializeNode() {
            const inputVal = document.getElementById('username-input').value.trim();
            if (!inputVal) {
                alert("Please specify a valid handle identifier.");
                return;
            }

            updateSystemStatus("Connecting to signaling network...", "warning");

            // Request Mic permissions upfront
            try {
                localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                alert("Microphone hardware access is required for audio communication channels.");
                updateSystemStatus("Hardware Permission Denied", "error");
                return;
            }

            // Initialize PeerJS
            peerInstance = new Peer(inputVal);

            peerInstance.on('open', (id) => {
                nodeHandleId = id;
                document.getElementById('display-node-id').innerText = id;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard-container').classList.remove('hidden');
                updateSystemStatus("Online & Encrypted", "success");
            });

            peerInstance.on('error', (err) => {
                alert("Network error: Handle already claimed or invalid topology.");
                console.error(err);
                updateSystemStatus("Connection Failed", "error");
            });

            // Incoming call listener
            peerInstance.on('call', (incomingCall) => {
                const acceptCall = confirm(`Incoming secure audio stream from: ${incomingCall.peer}. Accept session?`);
                if (acceptCall) {
                    activeCallSession = incomingCall;
                    incomingCall.answer(localAudioStream);
                    bindCallEvents(incomingCall.peer);
                } else {
                    incomingCall.close();
                }
            });
        }

        function initiateCall() {
            const targetId = document.getElementById('target-id-input').value.trim();
            if (!targetId) {
                alert("Target handle required.");
                return;
            }
            if (targetId === nodeHandleId) {
                alert("Loopback routing prohibited.");
                return;
            }

            updateSystemStatus("Dialing target node...", "warning");
            const call = peerInstance.call(targetId, localAudioStream);
            activeCallSession = call;
            bindCallEvents(targetId);
        }

        function bindCallEvents(remotePeerId) {
            document.getElementById('remote-peer-label').innerText = `Active with: ${remotePeerId}`;
            document.getElementById('active-call-panel').classList.remove('hidden');
            updateSystemStatus("In Call Session", "success");

            activeCallSession.on('stream', (incomingStream) => {
                const audioEl = document.getElementById('remote-audio-stream');
                audioEl.srcObject = incomingStream;
                audioEl.play().catch(e => console.log("Audio autoplay restricted:", e));
            });

            activeCallSession.on('close', () => {
                resetCallUI();
            });

            activeCallSession.on('error', (err) => {
                console.error(err);
                resetCallUI();
            });
        }

        function terminateCall() {
            if (activeCallSession) {
                activeCallSession.close();
            }
            resetCallUI();
        }

        function resetCallUI() {
            document.getElementById('active-call-panel').classList.add('hidden');
            document.getElementById('target-id-input').value = '';
            activeCallSession = null;
            updateSystemStatus("Online & Encrypted", "success");
        }
    </script>
</body>
</html>
