<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCall - Internet Voice Calling</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS Library for WebRTC Audio Calling -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- Socket.io for Real-time Signaling -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-f-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-emerald-400 mb-2">📞 WebCall</h1>
        <p class="text-xs text-slate-400 text-center mb-6">Free Internet Voice Calling App</p>

        <!-- Connection Status -->
        <div id="status-box" class="mb-4 p-3 rounded-lg bg-slate-700/50 text-sm text-center text-yellow-400">
            Connecting to server...
        </div>

        <!-- Step 1: Register Your ID -->
        <div id="setup-section" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Apna Naam ya ID Daalo:</label>
                <input type="text" id="my-id-input" placeholder="jaise: rahul_123" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <button onclick="registerUser()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg transition duration-200 shadow-lg shadow-emerald-900/40">
                Ready Ho Jao (Connect)
            </button>
        </div>

        <!-- Step 2: Calling Section (Hidden initially) -->
        <div id="call-section" class="hidden space-y-4">
            <div class="p-3 bg-slate-900 rounded-lg border border-slate-700">
                <span class="text-xs text-slate-400">Teri My ID:</span>
                <div id="display-my-id" class="text-lg font-mono font-bold text-emerald-400">---</div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Samne Wale ki ID Daalo:</label>
                <input type="text" id="target-id-input" placeholder="Dost ki ID yahan daalo" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 text-white">
            </div>

            <button onclick="makeCall()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg transition duration-200 shadow-lg shadow-blue-900/40">
                Call Lagao 🎙️
            </button>
        </div>

        <!-- Call Active / Incoming Call Box -->
        <div id="active-call-box" class="hidden mt-6 p-4 bg-slate-900 rounded-xl border border-slate-700 text-center space-y-3">
            <div id="call-status-text" class="text-sm font-medium text-emerald-400 animate-pulse">Call Connected...</div>
            <button onclick="endCall()" class="w-full py-2 bg-red-600 hover:bg-red-500 font-semibold rounded-lg transition duration-200">
                Call Kato ❌
            </button>
        </div>
    </div>

    <!-- Hidden Audio Element to Play Voice -->
    <audio id="remote-audio" autoplay></audio>

    <script>
        let socket;
        let peer;
        let currentPeerId;
        let activeCall = null;
        let localStream = null;

        // Yahan apne Render wale backend ka URL dalna jab deploy ho jaye (abhi ke liye localhost ya public url)
        const BACKEND_URL = "https://YOUR-RENDER-BACKEND-URL.onrender.com"; 

        function registerUser() {
            const inputId = document.getElementById('my-id-input').value.trim();
            if (!inputId) {
                alert("Pehle koi valid ID ya naam daal!");
                return;
            }

            // Initialize PeerJS with custom ID
            peer = new Peer(inputId);

            peer.on('open', (id) => {
                currentPeerId = id;
                document.getElementById('display-my-id').innerText = id;
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('call-section').classList.remove('hidden');
                document.getElementById('status-box').innerText = "Status: Online & Ready!";
                document.getElementById('status-box').className = "mb-4 p-3 rounded-lg bg-slate-700/50 text-sm text-center text-emerald-400";
                
                setupMediaStream();
            });

            peer.on('error', (err) => {
                alert("Error: Yeh ID pehle se kisi ne le rakhi hai ya connection error hai.");
                console.error(err);
            });

            // Listen for incoming calls
            peer.on('call', async (call) => {
                const accept = confirm("Incoming Call aa rahi hai! Uthana hai?");
                if (accept) {
                    activeCall = call;
                    call.answer(localStream);
                    handleCallEvents();
                } else {
                    call.close();
                }
            });
        }

        async function setupMediaStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                alert("Microphone ki permission deni padegi bhai calling ke liye!");
                console.error(err);
            }
        }

        function makeCall() {
            const targetId = document.getElementById('target-id-input').value.trim();
            if (!targetId) {
                alert("Dost ki ID toh daal!");
                return;
            }
            if (targetId === currentPeerId) {
                alert("Khud ko thodi call lagayega!");
                return;
            }

            document.getElementById('call-status-text').innerText = `Calling ${targetId}...`;
            document.getElementById('active-call-box').classList.remove('hidden');

            const call = peer.call(targetId, localStream);
            activeCall = call;
            handleCallEvents();
        }

        function handleCallEvents() {
            document.getElementById('active-call-box').classList.remove('hidden');
            document.getElementById('call-status-text').innerText = "Connected & Talking...";

            activeCall.on('stream', (remoteStream) => {
                const remoteAudio = document.getElementById('remote-audio');
                remoteAudio.srcObject = remoteStream;
                remoteAudio.play();
            });

            activeCall.on('close', () => {
                resetCallUI();
            });
        }

        function endCall() {
            if (activeCall) {
                activeCall.close();
            }
            resetCallUI();
        }

        function resetCallUI() {
            document.getElementById('active-call-box').classList.add('hidden');
            document.getElementById('call-status-text').innerText = "Call Connected...";
            if (activeCall) activeCall = null;
        }
    </script>
</body>
</html>
