<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b10">
  <title>Callio — You're offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0b10;color:#f7f5ff;font:16px system-ui,sans-serif;text-align:center}
    main{max-width:360px;padding:34px 26px;border:1px solid #9b83e944;border-radius:26px;background:#171620;box-shadow:0 24px 80px #0008}h1{margin:0 0 10px;font-size:28px}p{color:#b8b2c7;line-height:1.6}.dot{width:62px;height:62px;margin:0 auto 20px;border-radius:20px;display:grid;place-items:center;background:#9675f52b;color:#c8b8ff;font-size:30px}button{margin-top:12px;border:0;border-radius:14px;padding:13px 22px;background:#9675f5;color:white;font-weight:700}
  </style>
</head>
<body><main><div class="dot">⌁</div><h1>You're offline</h1><p>Callio needs an internet connection for sign-in, friends and audio calls. Check your connection and try again.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
